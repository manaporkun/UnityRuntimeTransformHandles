name: Publish UPM Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Least-privilege: permissions are granted per job. Only `publish` writes to the repo.
permissions: {}

# Serialize per ref so two main pushes can't run the publish/bump/tag steps concurrently
# (which previously raced on the version-bump commit and tag). Stale PR runs are cancelled;
# main runs queue. A stale run fails closed rather than publishing a newer untested main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Computes the gates for the licensed Unity test job: whether Unity credentials are
  # available (they are not on Dependabot/fork runs - the job then skips neutrally instead
  # of failing red), and whether the PR touches code at all (docs-only PRs skip the
  # ~5-minute licensed editor run). The secrets context is not available in job-level
  # `if:` expressions, so the check runs in a step and is exported as a job output.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has-unity-secrets: ${{ steps.secrets.outputs.has-secrets }}
      code-changed: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Detect code changes
        id: filter
        # PR-only: the output is only consulted for pull_request runs, and paths-filter
        # has no natural diff base on workflow_dispatch.
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - 'Packages/**'
              - 'Assets/**'
              - 'ProjectSettings/**'
              - 'ci/**'
              - '.github/actions/**'
              - '.github/workflows/publish-upm.yml'

      - name: Check Unity credentials
        id: secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ] || [ -n "$UNITY_LICENSING_SERVER" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity credentials unavailable (Dependabot/fork run?); the licensed test job will be skipped."
          fi

  candidate:
    name: Freeze release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Prepare fixed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ] && [ "$REF" = refs/heads/main ]; then
            python3 ci/release-candidate.py prepare --repository "$REPOSITORY"
          else
            python3 ci/release-candidate.py prepare
          fi

      - name: Upload candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate
          path: artifacts/candidate
          if-no-files-found: error

  # UPM-spec gate: manifest + required files + asmdef sanity. No Unity license needed,
  # so it runs fast on every PR and enforces the package floor going forward.
  validate:
    name: Validate package
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download fixed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate
          path: artifacts/candidate

      - name: Apply candidate artifacts
        run: python3 ci/release-candidate.py apply

      - name: Validate package boundaries
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py'
          python3 ci/verify-package-boundaries.py

      - name: Validate manifests and structure
        run: |
          set -uo pipefail
          fail=0
          err(){ echo "::error::$1"; fail=1; }
          for PKG in Packages/com.orkunmanap.runtime-transform-handles Packages/com.orkunmanap.runtime-transform-handles.demos; do
            MANIFEST="$PKG/package.json"
            if ! jq empty "$MANIFEST" 2>/dev/null; then err "invalid or missing $MANIFEST"; continue; fi
            for k in name version displayName description unity; do
              v=$(jq -r --arg k "$k" '.[$k] // empty' "$MANIFEST")
              [ -n "$v" ] || err "$MANIFEST missing '$k'"
            done
            NAME=$(jq -r '.name // ""' "$MANIFEST")
            echo "$NAME" | grep -qE '^[a-z0-9]+(\.[a-z0-9-]+)+$' || err "invalid package name '$NAME'"
            VER=$(jq -r '.version // ""' "$MANIFEST")
            echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$' || err "version '$VER' not semver"
            UNITY=$(jq -r '.unity // ""' "$MANIFEST")
            echo "$UNITY" | grep -qE '^[0-9]{4}\.[0-9]+$' || err "unity '$UNITY' not in YYYY.N form"
            for f in README.md LICENSE.md CHANGELOG.md "Third Party Notices.md"; do
              [ -f "$PKG/$f" ] || err "missing in-package file: $PKG/$f"
            done
            while IFS= read -r sample; do
              [ -z "$sample" ] || [ -d "$PKG/$sample" ] || err "sample path not found: $sample"
            done < <(jq -r '.samples[]?.path' "$MANIFEST")
            while IFS= read -r -d '' assembly; do
              jq -e '.name' "$assembly" >/dev/null 2>&1 || err "asmdef invalid or unnamed: $assembly"
            done < <(find "$PKG" -name '*.asmdef' -print0)
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "Both package manifests validated."

  # Gate: the package must compile and its EditMode + PlayMode tests must pass
  # before anything is published. Runs on pull_request too so breakage is caught
  # before it reaches main. Skips neutrally (not red) when Unity credentials are
  # unavailable (Dependabot/forks) and on docs-only PRs; pushes to main always test.
  test:
    name: Tests (input ${{ matrix.input }})
    strategy:
      fail-fast: false
      matrix:
        input: [0, 1]
    needs: [preflight, candidate]
    if: >-
      needs.preflight.outputs.has-unity-secrets == 'true' &&
      (github.event_name != 'pull_request' || needs.preflight.outputs.code-changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download fixed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate
          path: artifacts/candidate

      - name: Apply candidate artifacts
        run: python3 ci/release-candidate.py apply

      - name: Cache Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: Library
          key: Library-input${{ matrix.input }}-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-input${{ matrix.input }}-

      - name: Select input backend
        env:
          INPUT_MODE: ${{ matrix.input }}
        run: |
          python3 - <<'PYINPUT'
          import os, re
          from pathlib import Path
          p = Path('ProjectSettings/ProjectSettings.asset')
          content, count = re.subn(r'(?m)^  activeInputHandler: [01]$', '  activeInputHandler: ' + os.environ['INPUT_MODE'], p.read_text())
          assert count == 1, 'expected exactly one input setting'
          p.write_text(content)
          PYINPUT

      - name: Prepare fresh test evidence
        run: |
          python3 -m unittest discover -s ci -p 'test_*.py'
          python3 ci/verify-unity-results.py prepare --project . --package Packages/com.orkunmanap.runtime-transform-handles --out artifacts/evidence --unity 6000.3.16f1 --input ${{ matrix.input }}

      - name: Run tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        with:
          cliVersion: v0.1.72
          unityVersion: 6000.3.16f1
          testMode: all
          customParameters: -transformHandlesIsolatedTests -testFilter TransformHandles.Tests.
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity 6 input ${{ matrix.input }} results

      - name: Collect and verify test evidence
        if: always()
        run: |
          python3 ci/verify-unity-results.py collect --out artifacts/evidence --play-xml artifacts/playmode-results.xml --edit-xml artifacts/editmode-results.xml --play-log artifacts/playmode.log --edit-log artifacts/editmode.log
          python3 ci/verify-unity-results.py verify --out artifacts/evidence --required-dir artifacts/candidate/required

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-input${{ matrix.input }}
          path: artifacts
          if-no-files-found: ignore

      - name: Verify candidate unchanged
        run: python3 ci/release-candidate.py verify

  demos-test:
    name: Demos (input ${{ matrix.input }})
    strategy:
      fail-fast: false
      matrix:
        input: [0, 1]
    needs: [preflight, candidate]
    if: >-
      needs.preflight.outputs.has-unity-secrets == 'true' &&
      (github.event_name != 'pull_request' || needs.preflight.outputs.code-changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download fixed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate
          path: artifacts/candidate

      - name: Apply candidate artifacts
        run: python3 ci/release-candidate.py apply

      - name: Cache Library
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: Library
          key: Library-demos-input${{ matrix.input }}-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-demos-input${{ matrix.input }}-

      - name: Select input backend
        env:
          INPUT_MODE: ${{ matrix.input }}
        run: |
          python3 - <<'PYINPUT'
          import os, re
          from pathlib import Path
          p = Path('ProjectSettings/ProjectSettings.asset')
          content, count = re.subn(r'(?m)^  activeInputHandler: [01]$', '  activeInputHandler: ' + os.environ['INPUT_MODE'], p.read_text())
          assert count == 1, 'expected exactly one input setting'
          p.write_text(content)
          PYINPUT

      - name: Import optional samples and record evidence
        run: |
          python3 ci/release-candidate.py import-samples
          python3 ci/verify-sample-results.py prepare --out artifacts/sample-evidence --unity 6000.3.16f1 --input ${{ matrix.input }}

      - name: Run tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        with:
          cliVersion: v0.1.72
          unityVersion: 6000.3.16f1
          testMode: playmode
          customParameters: -testFilter TransformHandles.Samples.
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Demos Unity 6 input ${{ matrix.input }} results

      - name: Verify exact sample suite
        if: always()
        run: python3 ci/verify-sample-results.py verify --out artifacts/sample-evidence --xml artifacts/playmode-results.xml --log artifacts/playmode.log --required-dir artifacts/candidate/required

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: demos-results-input${{ matrix.input }}
          path: artifacts
          if-no-files-found: ignore

      - name: Verify candidate unchanged
        run: python3 ci/release-candidate.py verify

  consumer-activation:
    name: Minimum consumer activation and return
    needs: [preflight, candidate, test, demos-test]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.demos-test.result == 'success' &&
      needs.preflight.outputs.has-unity-secrets == 'true' &&
      (github.event_name != 'pull_request' || needs.preflight.outputs.code-changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      UNITY_LICENSE: ''
      UNITY_LICENSING_SERVER: ''
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download fixed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate
          path: artifacts/candidate

      - name: Generate a fresh minimum consumer
        run: python3 ci/consumer-project.py prepare --candidate artifacts/candidate --work artifacts/consumer-work --profile 2021-legacy --transport tarball --mount-root /github/workspace/artifacts/consumer-work

      # One bounded lifecycle must prove real UPM bootstrap and an explicit license
      # return before any matrix row can repeatedly acquire the same account seat.
      - name: Resolve Core and return the account license
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: core-resolve
          image: unityci/editor@sha256:6ca652f117ddbec52602ae3079df3cefc9fd2a4ec1282e07c8fbd638ef102eb6
          github-token: ${{ github.token }}

      - name: Upload minimum activation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consumer-minimum-activation
          include-hidden-files: true
          path: |
            artifacts/consumer-work/run.json
            artifacts/consumer-work/evidence
            artifacts/consumer-work/projects/*/.journey/editor
          if-no-files-found: error

  consumer:
    name: Consumer (${{ matrix.profile }}, ${{ matrix.transport }}, ${{ matrix.scope }})
    # Wait for the existing licensed suites so the new max-parallel budget does not
    # add two concurrent seats on top of the Core/Demos matrices.
    needs: [preflight, candidate, test, demos-test, consumer-activation]
    if: >-
      !cancelled() && needs.test.result == 'success' && needs.demos-test.result == 'success' &&
      needs.consumer-activation.result == 'success' &&
      needs.preflight.outputs.has-unity-secrets == 'true' &&
      (github.event_name != 'pull_request' || needs.preflight.outputs.code-changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      checks: write
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
      # The old 2021.3.0f1 client misreports a mismatched ULF as activated,
      # preventing the CLI's account fallback. Select account activation directly.
      UNITY_LICENSE: ${{ matrix.profile != '2021-legacy' && secrets.UNITY_LICENSE || '' }}
      UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - profile: 2021-legacy
            transport: tarball
            scope: full
            image: unityci/editor@sha256:6ca652f117ddbec52602ae3079df3cefc9fd2a4ec1282e07c8fbd638ef102eb6
          - profile: 2021-legacy
            transport: git
            scope: probe
            image: unityci/editor@sha256:6ca652f117ddbec52602ae3079df3cefc9fd2a4ec1282e07c8fbd638ef102eb6
          - profile: 6-legacy
            transport: tarball
            scope: full
            image: unityci/editor@sha256:7b001255b94971fa056d67966eed2191dd892cf23d948233f87e711b615a9913
          - profile: 6-legacy
            transport: git
            scope: probe
            image: unityci/editor@sha256:7b001255b94971fa056d67966eed2191dd892cf23d948233f87e711b615a9913
          - profile: 6-input
            transport: tarball
            scope: full
            image: unityci/editor@sha256:7b001255b94971fa056d67966eed2191dd892cf23d948233f87e711b615a9913
          - profile: 6-input
            transport: git
            scope: full
            image: unityci/editor@sha256:7b001255b94971fa056d67966eed2191dd892cf23d948233f87e711b615a9913
          - profile: 6-urp
            transport: tarball
            scope: full
            image: unityci/editor@sha256:7b001255b94971fa056d67966eed2191dd892cf23d948233f87e711b615a9913
          - profile: 6-urp
            transport: git
            scope: probe
            image: unityci/editor@sha256:7b001255b94971fa056d67966eed2191dd892cf23d948233f87e711b615a9913
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Download fixed candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate
          path: artifacts/candidate

      - name: Install Linux display and input tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xdotool libgl1-mesa-dri libglx-mesa0 libxcursor1 libxrandr2 libxinerama1 libxi6 libpulse0

      - name: Generate a fresh UPM consumer
        env:
          CONSUMER_PROFILE: ${{ matrix.profile }}
          CONSUMER_TRANSPORT: ${{ matrix.transport }}
        run: |
          python3 - <<'PYIDENTITY'
          import json, subprocess
          from pathlib import Path
          metadata = json.loads(Path('artifacts/candidate/candidate.json').read_text())
          assert metadata['source'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          PYIDENTITY
          python3 ci/consumer-project.py prepare --candidate artifacts/candidate --work artifacts/consumer-work --profile "$CONSUMER_PROFILE" --transport "$CONSUMER_TRANSPORT" --mount-root /github/workspace/artifacts/consumer-work

      - name: Consumer core-resolve
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: core-resolve
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer core-setup
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: core-setup
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer core-tests
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: core-tests
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer core-build
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: core-build
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer pair-build probe
        if: matrix.scope == 'probe'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: pair-build
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-Demo-import
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-Demo-import
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-Demo-build
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-Demo-build
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-Demo-tests
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-Demo-tests
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-LevelEditor-import
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-LevelEditor-import
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-LevelEditor-build
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-LevelEditor-build
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-LevelEditor-tests
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-LevelEditor-tests
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-ModularBuilding-import
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-ModularBuilding-import
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-ModularBuilding-build
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-ModularBuilding-build
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-ModularBuilding-tests
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-ModularBuilding-tests
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-ProductConfigurator-import
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-ProductConfigurator-import
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-ProductConfigurator-build
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-ProductConfigurator-build
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-ProductConfigurator-tests
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-ProductConfigurator-tests
          image: ${{ matrix.image }}
          github-token: ${{ github.token }}

      - name: Consumer sample-DemoBrowser-import
        if: matrix.scope == 'full'
        timeout-minutes: 20
        uses: ./.github/actions/consumer-editor
        with:
          stage: sample-DemoBrowser-import
