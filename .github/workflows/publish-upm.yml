name: Publish UPM Package

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Least-privilege: permissions are granted per job. Only `publish` writes to the repo.
permissions: {}

# Serialize per ref so two main pushes can't run the publish/bump/tag steps concurrently
# (which previously raced on the version-bump commit and tag). Stale PR runs are cancelled;
# main runs queue (never cancelled mid-release) so an in-flight release always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Computes the gates for the licensed Unity test job: whether Unity credentials are
  # available (they are not on Dependabot/fork runs - the job then skips neutrally instead
  # of failing red), and whether the PR touches code at all (docs-only PRs skip the
  # ~5-minute licensed editor run). The secrets context is not available in job-level
  # `if:` expressions, so the check runs in a step and is exported as a job output.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has-unity-secrets: ${{ steps.secrets.outputs.has-secrets }}
      code-changed: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Detect code changes
        id: filter
        # PR-only: the output is only consulted for pull_request runs, and paths-filter
        # has no natural diff base on workflow_dispatch.
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            code:
              - 'Packages/**'
              - 'Assets/**'
              - 'ProjectSettings/**'
              - '.github/workflows/publish-upm.yml'

      - name: Check Unity credentials
        id: secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ] || [ -n "$UNITY_LICENSING_SERVER" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity credentials unavailable (Dependabot/fork run?); the licensed test job will be skipped."
          fi

  # UPM-spec gate: manifest + required files + asmdef sanity. No Unity license needed,
  # so it runs fast on every PR and enforces the package floor going forward.
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Validate manifest & structure
        run: |
          set -uo pipefail
          PKG="Packages/com.orkunmanap.runtime-transform-handles"
          MANIFEST="$PKG/package.json"
          fail=0
          err(){ echo "::error::$1"; fail=1; }

          if [ ! -f "$MANIFEST" ]; then echo "::error::package.json missing"; exit 1; fi
          jq empty "$MANIFEST" 2>/dev/null || err "package.json is not valid JSON"

          for k in name version displayName description unity; do
            v=$(jq -r --arg k "$k" '.[$k] // empty' "$MANIFEST")
            [ -n "$v" ] || err "package.json missing '$k'"
          done

          NAME=$(jq -r '.name // ""' "$MANIFEST")
          echo "$NAME" | grep -qE '^[a-z0-9]+(\.[a-z0-9-]+)+$' || err "invalid package name '$NAME'"

          VER=$(jq -r '.version // ""' "$MANIFEST")
          echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$' || err "version '$VER' not semver"

          UNITY=$(jq -r '.unity // ""' "$MANIFEST")
          echo "$UNITY" | grep -qE '^[0-9]{4}\.[0-9]+$' || err "unity '$UNITY' not in YYYY.N form"

          for f in README.md LICENSE.md CHANGELOG.md "Third Party Notices.md"; do
            [ -f "$PKG/$f" ] || err "missing in-package file: $f"
          done

          # Every registered sample path must exist.
          while IFS= read -r p; do
            [ -z "$p" ] && continue
            [ -d "$PKG/$p" ] || err "samples[] path not found: $p"
          done < <(jq -r '.samples[]?.path' "$MANIFEST")

          # Every asmdef (incl. hidden samples) must be valid JSON with a name.
          while IFS= read -r -d '' a; do
            jq -e '.name' "$a" >/dev/null 2>&1 || err "asmdef invalid or unnamed: $a"
          done < <(find "$PKG" -name '*.asmdef' -print0)

          if [ "$fail" -ne 0 ]; then echo "Package validation FAILED"; exit 1; fi
          echo "Package validation passed."

  # Gate: the package must compile and its EditMode + PlayMode tests must pass
  # before anything is published. Runs on pull_request too so breakage is caught
  # before it reaches main. Skips neutrally (not red) when Unity credentials are
  # unavailable (Dependabot/forks) and on docs-only PRs; pushes to main always test.
  test:
    name: Tests (EditMode + PlayMode)
    needs: preflight
    if: >-
      needs.preflight.outputs.has-unity-secrets == 'true' &&
      (github.event_name != 'pull_request' || needs.preflight.outputs.code-changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Cache Library
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        with:
          unityVersion: 6000.3.16f1
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: artifacts
          if-no-files-found: ignore

  publish:
    # Only publish on a real push to main (or manual dispatch), and only after validate + tests
    # SUCCEEDED. `needs.test.result == 'success'` (with !cancelled()) is load-bearing: the test
    # job can be SKIPPED when Unity credentials are missing, and a skipped gate must never
    # let untested code publish.
    needs: [validate, test]
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.test.result == 'success' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare release and push
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # actions/checkout pins this job to the triggering commit (github.sha). The job is serialized
        # by the concurrency group, but while it waited on the ~5-min test job (or queued behind another
        # release) main can advance, and it can advance again between computing the bump and pushing it.
        # So compute version + notes against the CURRENT origin/main and commit + push as one unit; if
        # the push is rejected, RECOMPUTE against the now-latest main and retry. Recomputing (rather than
        # rebasing a pre-built commit) keeps the release correct whatever landed in the window:
        #   - a non-bump commit that slipped in is folded into this release's notes and bump type;
        #   - a competing release bump makes the range empty -> bump=none -> this run skips cleanly,
        #     so there is no duplicate version and no colliding (non-force) tag push.
        run: |
          PACKAGE_PATH="Packages/com.orkunmanap.runtime-transform-handles"
          MANIFEST="$PACKAGE_PATH/package.json"
          CHANGELOG="$PACKAGE_PATH/CHANGELOG.md"

          # Robust "is this version already released?" check. Distinguishes a real 404 (no release) from
          # a transient auth/rate-limit/network error: only a 404 means "not released", anything else
          # fails the job loudly so a flaky API call can never trigger a false recovery.
          release_exists() {
            local tag="$1" err
            if err=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" 2>&1 >/dev/null); then
              return 0
            fi
            if printf '%s' "$err" | grep -qE "HTTP 404|Not Found"; then
              return 1
            fi
            echo "::error::release lookup for $tag failed (not a 404): $err"
            exit 1
          }

          # Recompute everything from the latest origin/main, edit the files, and commit the bump.
          # Sets NEW_VERSION / BUMP / SKIP / RECOVER and (re)writes /tmp/release_entries.md for later steps.
          prepare() {
            git fetch origin main
            git checkout -B main origin/main

            RECOVER="false"
            CURRENT=$(jq -r '.version' "$MANIFEST")
            echo "Current version: $CURRENT"

            # Release boundary = the last automated version-bump commit on main (tag-independent: tags
            # live on the orphan `upm` branch, unreachable from main, so `git describe` is wrong here).
            RANGE_START=$(git log --grep='^chore: bump version to' --format=%H -n 1 HEAD || true)
            if [ -n "$RANGE_START" ]; then
              RANGE="$RANGE_START..HEAD"
              echo "Previous release commit: $RANGE_START"
            else
              RANGE="HEAD"
              echo "No previous bump commit found; treating all history as the first release."
            fi
            echo "Commit range: $RANGE"

            # Recovery takes priority over a new bump: if the last automated bump's version was never
            # released (an earlier publish run pushed the bump commit, then died before tag/release),
            # finish THAT release first — even if newer commits have since landed. Publish runs are
            # serialized, so an unreleased bump means its run already terminated; there is no concurrent
            # release to collide with. The newer commits keep their place in the range and ship next run.
            if [ -n "$RANGE_START" ] && ! release_exists "v$CURRENT"; then
              echo "v$CURRENT was bumped on main but has no release; completing it before any new bump."
              SKIP="false"
              RECOVER="true"
              BUMP="none"
              NEW_VERSION="$CURRENT"
              # Package the bump commit's tree, NOT HEAD — commits that landed after the interrupted
              # publish must not ship under this recovered tag (they release on a later run).
              RELEASE_REF="$RANGE_START"
              # Recover this version's notes from the CHANGELOG at the bump commit (the same ref we
              # package from), so the GitHub release notes match the shipped in-package changelog even
              # if main's CHANGELOG changed after the bump. Capture the FULL section body ("### "
              # group headings included), not just dash lines - curated sections are grouped.
              git show "$RANGE_START:$CHANGELOG" \
                | awk -v h="## [$CURRENT]" '
                    index($0, h) == 1 { grab = 1; next }
                    grab && /^## \[/ { exit }
                    grab { print }
                  ' > /tmp/release_entries.md
              return 0
            fi

            # Full messages (%B) so `BREAKING CHANGE:` footers are seen, not just subjects.
            COMMITS=$(git log $RANGE --format=%B)

            # Release notes: prefer the curated [Unreleased] section of the CHANGELOG. If it has
            # real content it becomes the release entries verbatim (and is consumed below when the
            # new version section is written). Otherwise fall back to commit subjects in the range,
            # grouped Keep-a-Changelog style by Conventional Commit type - never the old raw
            # "git log --pretty='- %s'" dump that put merge commits into released sections.
            UNRELEASED_BODY=""
            if [ -f "$CHANGELOG" ] && grep -q '^## \[Unreleased\]' "$CHANGELOG"; then
              UNRELEASED_BODY=$(awk '
                /^## \[Unreleased\]/ { grab = 1; next }
                grab && /^## \[/ { exit }
                grab { print }
              ' "$CHANGELOG")
            fi

            if printf '%s\n' "$UNRELEASED_BODY" | grep -qE '^(### |- )'; then
              # sed '/./,$!d' strips the leading blank lines left by the heading separator.
              printf '%s\n' "$UNRELEASED_BODY" | sed '/./,$!d' > /tmp/release_entries.md
            else
              git log $RANGE --no-merges --pretty=tformat:"%s" \
                | grep -vE '^chore: bump version to' > /tmp/subjects.txt || true
              awk '
                {
                  rest = $0; type = ""
                  if (match($0, /^[A-Za-z]+(\([^)]*\))?!?: /)) {
                    type = substr($0, 1, RLENGTH)
                    rest = substr($0, RLENGTH + 1)
                    sub(/\(.*/, "", type); sub(/!?: ?$/, "", type)
                    type = tolower(type)
                  }
                  if (type == "feat")                                   group = "Added"
                  else if (type == "fix")                               group = "Fixed"
                  else if (type == "perf" || type == "refactor")        group = "Changed"
                  else if (type == "docs")                              group = "Documentation"
                  else if (type ~ /^(ci|build|chore|test|style)$/)      group = "Maintenance"
                  else                                                  { group = "Changed"; rest = $0 }
                  lines[group] = lines[group] "- " rest "\n"
                }
                END {
                  n = split("Added Changed Fixed Documentation Maintenance", order, " ")
                  first = 1
                  for (i = 1; i <= n; i++) {
                    g = order[i]
                    if (lines[g] != "") {
                      if (!first) printf "\n"
                      printf "### %s\n%s", g, lines[g]
                      first = 0
                    }
                  }
                }
              ' /tmp/subjects.txt > /tmp/release_entries.md
            fi

            # Strict Conventional Commits only — no bare aliases, no "any change -> patch" fallback.
            BUMP="none"
            if echo "$COMMITS" | grep -qE "^BREAKING CHANGE:" \
               || echo "$COMMITS" | grep -qiE "^[a-z]+(\(.+\))?!:"; then
              BUMP="major"
            elif echo "$COMMITS" | grep -qiE "^feat(\(.+\))?:"; then
              BUMP="minor"
            elif echo "$COMMITS" | grep -qiE "^(fix|perf|refactor)(\(.+\))?:"; then
              BUMP="patch"
            elif echo "$COMMITS" | grep -qiE "^(docs|style|chore|ci|test|build)(\(.+\))?:"; then
              # Housekeeping types bump only when SHIPPING code/manifest changed (not Tests/ or Samples~/),
              # otherwise adding a test would cut a pointless release.
              if git log $RANGE --name-only --pretty=format: | sort -u \
                   | grep -vE "/Tests/|/Samples~/" \
                   | grep -qE "\.cs$|package\.json$"; then
                BUMP="patch"
              fi
            fi
            echo "Bump type: $BUMP"

            # No new release-worthy commits and the current version is already released (recovery above
            # handled the not-yet-released case): nothing to do.
            if [ "$BUMP" = "none" ]; then
              SKIP="true"
              NEW_VERSION="$CURRENT"
              return 0
            fi
            SKIP="false"

            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            NEW_VERSION="$MAJOR.$MINOR.$PATCH"
            echo "New version: $NEW_VERSION"

            jq ".version = \"$NEW_VERSION\"" "$MANIFEST" > tmp.json && mv tmp.json "$MANIFEST"

            DATE=$(date +%Y-%m-%d)
            {
              echo "## [$NEW_VERSION] - $DATE"
              echo ""
              cat /tmp/release_entries.md
              echo ""
            } > /tmp/new_entry.md
            if [ -f "$CHANGELOG" ]; then
              if grep -q '^## \[Unreleased\]' "$CHANGELOG"; then
                # Consume the [Unreleased] body (it became this release's notes) and insert the
                # new version section right below the now-empty [Unreleased] heading.
                awk '
                  /^## \[Unreleased\]/ { print; print ""; skip = 1; ins = 1; next }
                  skip && /^## \[/ { skip = 0 }
                  skip { next }
                  ins && /^## \[/ { while ((getline line < "/tmp/new_entry.md") > 0) print line; ins = 0 }
                  { print }
                  END { if (ins) { while ((getline line < "/tmp/new_entry.md") > 0) print line } }
                ' "$CHANGELOG" > /tmp/changelog.md && mv /tmp/changelog.md "$CHANGELOG"
              else
                # Legacy layout without an [Unreleased] heading: insert before the first version heading.
                awk 'BEGIN{ins=0}
                     /^## \[/ && ins==0 {while((getline line < "/tmp/new_entry.md")>0) print line; ins=1}
                     {print}
                     END{if(ins==0){while((getline line < "/tmp/new_entry.md")>0) print line}}' \
                    "$CHANGELOG" > /tmp/changelog.md && mv /tmp/changelog.md "$CHANGELOG"
              fi
            else
              cp /tmp/new_entry.md "$CHANGELOG"
            fi

            git add "$MANIFEST" "$CHANGELOG"
            git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
            # Package exactly this bump commit, so later steps are immune to main advancing again.
            RELEASE_REF="$(git rev-parse HEAD)"
          }

          # Each iteration recomputes against the latest main, so the loop self-corrects when main moves:
          # the next attempt's range/version/notes reflect whatever just landed. No rebase of a stale
          # commit, so nothing gets orphaned and a competing bump is detected as nothing-to-do.
          pushed=0
          for attempt in 1 2 3 4 5; do
            prepare
            if [ "$SKIP" = "true" ]; then
              echo "Nothing to release (already published, or no bump in range); skipping."
              break
            fi
            if [ "$RECOVER" = "true" ]; then
              echo "Completing an incomplete publish of v$NEW_VERSION (nothing to push)."
              pushed=1
              break
            fi
            if git push origin main; then pushed=1; break; fi
            echo "push rejected (attempt $attempt); main advanced — recomputing against latest origin/main"
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
          done

          if [ "$SKIP" = "true" ]; then
            {
              echo "skip=true"
              echo "version=$NEW_VERSION"
              echo "bump=none"
            } >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$pushed" -ne 1 ]; then
            echo "::error::Failed to push the version bump after $attempt attempt(s)."
            exit 1
          fi

          {
            echo "skip=false"
            echo "version=$NEW_VERSION"
            echo "bump=$BUMP"
            echo "release_ref=$RELEASE_REF"
          } >> $GITHUB_OUTPUT

      - name: Create/Update UPM branch
        if: steps.release.outputs.skip != 'true'
        run: |
          PACKAGE_PATH="Packages/com.orkunmanap.runtime-transform-handles"
          UPM_BRANCH="upm"
          # Exact commit whose package this release ships: the bump commit (normal) or the
          # interrupted bump being recovered. Never plain `main`, which may have moved on.
          RELEASE_REF="${{ steps.release.outputs.release_ref }}"

          if git ls-remote --heads origin $UPM_BRANCH | grep -q $UPM_BRANCH; then
            echo "UPM branch exists, updating..."
            git checkout $UPM_BRANCH
            git pull origin $UPM_BRANCH

            find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

            git checkout "$RELEASE_REF" -- "$PACKAGE_PATH"
            mv "$PACKAGE_PATH"/* .
            rm -rf Packages
          else
            echo "Creating new UPM branch..."
            git checkout --orphan $UPM_BRANCH

            git rm -rf . || true
            git clean -fd

            git checkout "$RELEASE_REF" -- "$PACKAGE_PATH"
            mv "$PACKAGE_PATH"/* .
            rm -rf Packages
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release v${{ steps.release.outputs.version }}"
            # force-with-lease: the remote-tracking ref is fresh from the pull above, so this
            # behaves like --force unless someone moved upm mid-run - then it fails loudly
            # instead of silently rewriting the branch consumers track.
            git push origin $UPM_BRANCH --force-with-lease
            echo "UPM branch updated successfully!"
          fi

      - name: Create version tag
        if: steps.release.outputs.skip != 'true'
        run: |
          VERSION="v${{ steps.release.outputs.version }}"

          git checkout upm

          # Idempotent: a recovery run (completing an earlier interrupted publish) may reach here with
          # the tag already pushed. Only create + push it when it is missing, so the non-force tag push
          # never fails the job on an existing tag.
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists on origin; leaving it."
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
            echo "Tagged version: $VERSION"
          fi

      - name: Generate changelog
        if: steps.release.outputs.skip != 'true'
        id: changelog
        run: |
          # Reuse the entries computed on main. The earlier `git describe HEAD^` ran here while
          # checked out on the `upm` branch (after the tag step), so it never saw main's history.
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/release_entries.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.release.outputs.skip != 'true'
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: v${{ steps.release.outputs.version }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Add to your `manifest.json`:
            ```json
            "com.orkunmanap.runtime-transform-handles": "https://github.com/${{ github.repository }}.git#v${{ steps.release.outputs.version }}"
            ```

            Or use the latest:
            ```json
            "com.orkunmanap.runtime-transform-handles": "https://github.com/${{ github.repository }}.git#upm"
            ```
          draft: false
          prerelease: false

      - name: Summary
        run: |
          if [ "${{ steps.release.outputs.skip }}" = "true" ]; then
            echo "## No Release Needed" >> $GITHUB_STEP_SUMMARY
            echo "No version bump was triggered by the commits." >> $GITHUB_STEP_SUMMARY
          else
            echo "## UPM Package Released 🎉" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Version:** v${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "**Bump Type:** ${{ steps.release.outputs.bump }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Installation" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            echo "\"com.orkunmanap.runtime-transform-handles\": \"https://github.com/${{ github.repository }}.git#upm\"" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
