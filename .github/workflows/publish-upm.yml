  publish:
    # Only publish on a real push to main (or manual dispatch), and only after validate + tests
    # SUCCEEDED. `needs.test.result == 'success'` (with !cancelled()) is load-bearing: the test
    # job can be SKIPPED when Unity credentials are missing, and a skipped gate must never
    # let untested code publish.
    needs: [validate, test, demos-test, consumer]
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.test.result == 'success' &&
      needs.demos-test.result == 'success' &&
      needs.consumer.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download tested candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate
          path: artifacts/candidate

      - name: Commit only the tested candidate
        id: release
        run: |
          python3 ci/release-candidate.py apply
          python3 ci/release-candidate.py verify
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          m = json.loads(Path('artifacts/candidate/candidate.json').read_text())
          assert m['publishable'], 'local previews cannot publish'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('skip=' + str(m['skip']).lower() + '\n')
              output.write('version=' + m['version'] + '\n')
              output.write('bump=' + m['bump'] + '\n')
          if m['skip']:
              raise SystemExit(0)
          subprocess.run(['git', 'fetch', 'origin', 'main'], check=True)
          current = subprocess.check_output(['git', 'rev-parse', 'origin/main'], text=True).strip()
          assert current == m['source'], 'main advanced; rerun validation for the new candidate'
          if m['recovery']:
              release_ref = m['package_source']
              # The recovered files were verified above; discard only this job's overlay before checkout.
              subprocess.run(['git', 'restore', '--source=HEAD', '--staged', '--worktree', '--', 'Packages'], check=True)
          else:
              subprocess.run(['git', 'add', 'Packages'], check=True)
              subprocess.run(['git', 'commit', '-m', 'chore: bump version to ' + m['version'] + ' [skip ci]'], check=True)
              release_ref = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              # A concurrent main push rejects this update. Never rebase or recompute after tests.
              subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/main'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('release_ref=' + release_ref + '\n')
          PYTHON
          cp artifacts/candidate/release-notes.md /tmp/release_entries.md

      - name: Verify existing tag before updating distribution
        if: steps.release.outputs.skip != 'true'
        run: |
          VERSION="v${{ steps.release.outputs.version }}"
          EXPECTED_TREE="$(git rev-parse "${{ steps.release.outputs.release_ref }}:Packages/com.orkunmanap.runtime-transform-handles")"
          git ls-remote --tags origin "refs/tags/$VERSION" > /tmp/existing-release-tag
          if [ -s /tmp/existing-release-tag ]; then
            git fetch origin "refs/tags/$VERSION:refs/tags/$VERSION"
            test "$(git rev-parse "$VERSION^{tree}")" = "$EXPECTED_TREE"
          fi

      - name: Create/Update UPM branch
        if: steps.release.outputs.skip != 'true'
        run: |
          PACKAGE_PATH="Packages/com.orkunmanap.runtime-transform-handles"
          UPM_BRANCH="upm"
          # Exact commit whose package this release ships: the bump commit (normal) or the
          # interrupted bump being recovered. Never plain `main`, which may have moved on.
          RELEASE_REF="${{ steps.release.outputs.release_ref }}"

          if git ls-remote --heads origin $UPM_BRANCH | grep -q $UPM_BRANCH; then
            echo "UPM branch exists, updating..."
            git checkout $UPM_BRANCH
            git pull origin $UPM_BRANCH

            find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

            git checkout "$RELEASE_REF" -- "$PACKAGE_PATH"
            cp -a "$PACKAGE_PATH"/. .
            rm -rf Packages
          else
            echo "Creating new UPM branch..."
            git checkout --orphan $UPM_BRANCH

            git rm -rf . || true
            git clean -fd

            git checkout "$RELEASE_REF" -- "$PACKAGE_PATH"
            cp -a "$PACKAGE_PATH"/. .
            rm -rf Packages
          fi

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release v${{ steps.release.outputs.version }}"
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$RELEASE_REF:$PACKAGE_PATH")"
            # force-with-lease: the remote-tracking ref is fresh from the pull above, so this
            # behaves like --force unless someone moved upm mid-run - then it fails loudly
            # instead of silently rewriting the branch consumers track.
            git push origin $UPM_BRANCH --force-with-lease
            echo "UPM branch updated successfully!"
          fi

      - name: Create version tag
        if: steps.release.outputs.skip != 'true'
        run: |
          VERSION="v${{ steps.release.outputs.version }}"

          git checkout upm
          EXPECTED_TREE="$(git rev-parse "${{ steps.release.outputs.release_ref }}:Packages/com.orkunmanap.runtime-transform-handles")"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"

          # Idempotent: a recovery run (completing an earlier interrupted publish) may reach here with
          # the tag already pushed. Only create + push it when it is missing, so the non-force tag push
          # never fails the job on an existing tag.
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q "refs/tags/$VERSION"; then
            git fetch origin "refs/tags/$VERSION:refs/tags/$VERSION"
            test "$(git rev-parse "$VERSION^{tree}")" = "$EXPECTED_TREE"
            echo "Tag $VERSION already matches the tested package."
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
            echo "Tagged version: $VERSION"
          fi

      - name: Generate changelog
        if: steps.release.outputs.skip != 'true'
        id: changelog
        run: |
          # Reuse the entries computed on main. The earlier `git describe HEAD^` ran here while
          # checked out on the `upm` branch (after the tag step), so it never saw main's history.
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/release_entries.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.release.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: v${{ steps.release.outputs.version }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.changelog }}

            ## Installation

            Add to your `manifest.json`:
            ```json
            "com.orkunmanap.runtime-transform-handles": "https://github.com/${{ github.repository }}.git#v${{ steps.release.outputs.version }}"
            ```

            Optional Demos uses two explicit project dependencies
            pinned to the same release source commit (the Core-only tag has no Demos path):
            ```json
            "com.orkunmanap.runtime-transform-handles": "https://github.com/${{ github.repository }}.git?path=/Packages/com.orkunmanap.runtime-transform-handles#${{ steps.release.outputs.release_ref }}",
            "com.orkunmanap.runtime-transform-handles.demos": "https://github.com/${{ github.repository }}.git?path=/Packages/com.orkunmanap.runtime-transform-handles.demos#${{ steps.release.outputs.release_ref }}"
            ```

            Or use the latest:
            ```json
            "com.orkunmanap.runtime-transform-handles": "https://github.com/${{ github.repository }}.git#upm"
            ```
          draft: false
          prerelease: false

      - name: Summary
        run: |
          if [ "${{ steps.release.outputs.skip }}" = "true" ]; then
            echo "## No Release Needed" >> $GITHUB_STEP_SUMMARY
            echo "No Core release was triggered. Demos-only changes are validated source distributions; they do not create a Core tag." >> $GITHUB_STEP_SUMMARY
          else
            echo "## UPM Package Released 🎉" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Version:** v${{ steps.release.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "**Bump Type:** ${{ steps.release.outputs.bump }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Installation" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            echo "\"com.orkunmanap.runtime-transform-handles\": \"https://github.com/${{ github.repository }}.git#upm\"" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
