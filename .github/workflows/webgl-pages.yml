name: Build and Deploy WebGL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - Assets/**
      - Packages/**
      - ProjectSettings/**
      - .github/workflows/webgl-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: webgl-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          echo "=== Disk usage after cleanup ==="
          df -h /

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate Unity activation configuration
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        run: |
          if [ -n "$UNITY_LICENSING_SERVER" ]; then
            echo "Using UNITY_LICENSING_SERVER activation."
            exit 0
          fi

          if [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && { [ -n "$UNITY_SERIAL" ] || [ -n "$UNITY_LICENSE" ]; }; then
            echo "Using credential-based Unity activation."
            exit 0
          fi

          echo "::error::Invalid Unity activation config. Set UNITY_LICENSING_SERVER or set UNITY_EMAIL + UNITY_PASSWORD + (UNITY_SERIAL or UNITY_LICENSE) as repository secrets."
          exit 1

      - name: Cache Library
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**') }}
          restore-keys: |
            Library-

      - name: Build WebGL project
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1 # v5
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}
        with:
          unityVersion: auto
          targetPlatform: WebGL
          buildMethod: BuildScript.BuildWebGLForPages

      - name: Resolve WebGL output path
        id: webgl-output
        run: |
          if [ -d Build/WebGL ]; then
            echo "path=Build/WebGL" >> "$GITHUB_OUTPUT"
          elif [ -d build/WebGL ]; then
            echo "path=build/WebGL" >> "$GITHUB_OUTPUT"
          else
            echo "::error::WebGL output not found in Build/WebGL or build/WebGL."
            echo "Directory snapshot:"
            find . -maxdepth 3 -type d | sort
            exit 1
          fi

      - name: Prepare Pages artifact
        run: |
          rm -rf site-dist
          cp -R "${{ steps.webgl-output.outputs.path }}" site-dist
          touch site-dist/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
